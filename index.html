<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treasure Hunt</title>
<style>
:root{
  --parch:#F6E7C1; --parch2:#E9CF91; --card:#FFF8E3; --ink:#3B2A1A; --muted:#7A6248; --line:#3B2A1A;
  --gold:#F2B705; --sea:#2A7FAF; --sea2:#6EC6EE; --red:#C0392B; --good:#2E9E5B; --goodbg:#D8F3E2; --bad:#C0392B; --badbg:#FFD9D2; --blue:#2A7FAF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--ink);background:#F6E7C1;background:linear-gradient(#F6E7C1,#E9CF91);background-attachment:fixed;font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:18px;line-height:1.3;min-height:100vh;-webkit-user-select:none;user-select:none}
button,input,textarea{font-family:inherit}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px 40px}
h1,h2{margin:0 0 6px;font-family:Georgia,"Times New Roman",serif}
.btn{font-size:1rem;font-weight:700;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:16px;padding:9px 14px;cursor:pointer;box-shadow:0 4px 0 var(--line);touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.55;cursor:default}
.btn.gold{background:var(--gold)}
.btn.sel{background:var(--gold)}
.btn.big{font-size:1.25rem;padding:13px 18px;width:100%}
.panel{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 6px 0 var(--line)}
.center{text-align:center}
.hint{color:var(--muted);margin:6px 0 10px}
.pill{border:3px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--card);font-weight:700;white-space:nowrap;font-size:.95rem}
.bar{height:16px;border:3px solid var(--line);border-radius:999px;background:var(--parch2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-right:3px solid var(--line)}
.bar i[style*="width:0%"]{border-right:0}
.stack{display:grid;grid-gap:10px;gap:10px;margin-top:8px}
.row{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;gap:10px;margin-top:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;grid-gap:10px;gap:10px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;margin:10px 0 4px}
.chips .btn{margin:4px;padding:5px 12px;font-size:.92rem;box-shadow:0 3px 0 var(--line)}
.foot{text-align:center;margin-top:20px}
.link{font-size:.95rem;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:6px}
.top{display:flex;align-items:center;margin-bottom:10px}
.top>*{margin-right:8px}
.top>*:last-child{margin-right:0}

/* home */
.ship{font-size:4.6rem;line-height:1.1;display:inline-block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.hero h1{font-size:1.9rem}
.hero .sub2{font-weight:700;margin:0 0 8px}
.hero small{color:var(--muted);display:block;margin-top:6px}

/* board */
.sea{background:#4DA6D6;background:linear-gradient(#6EC6EE,#2A7FAF);border:4px solid var(--line);border-radius:20px;padding:8px}
.board{display:grid;grid-gap:3px;gap:3px}
.board .sq .in{font-size:1.15rem;border-width:2px;border-radius:6px;overflow:hidden}
.board .sq .tok{font-size:1.5rem;position:relative;z-index:3}
.board .sq .no{z-index:2;font-size:.5rem}
.board .sq.corner .in{border-width:3px}
.band{position:absolute;z-index:1;border:0}
.band.b{top:0;left:0;right:0;height:22%}
.band.t{bottom:0;left:0;right:0;height:22%}
.band.l{top:0;bottom:0;right:0;width:22%}
.band.r{top:0;bottom:0;left:0;width:22%}
.cbox{position:relative;min-width:0;min-height:0;background:#FFF8E3;border:3px solid var(--line);border-radius:10px;overflow:hidden}
.cbox .cin{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
.ctitle{font-family:Georgia,serif;font-weight:900;text-align:center;line-height:1;transform:rotate(-35deg);font-size:clamp(1.2rem,8vw,2.8rem);letter-spacing:2px;color:var(--ink)}
.ctitle small{display:block;font-size:.55em;letter-spacing:6px;color:var(--red)}
.ccard{position:absolute;width:30%;height:22%;border:3px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:700;font-size:clamp(.5rem,2.4vw,.8rem);text-align:center;line-height:1.1}
.ccard span{font-size:1.6em}
.ccard.a{top:8%;left:8%;background:#F7B6DD;transform:rotate(30deg)}
.ccard.c{bottom:8%;right:8%;background:#FFE680;transform:rotate(30deg)}
.sq{position:relative;width:100%;padding-bottom:100%}
.sq .in{position:absolute;top:0;left:0;right:0;bottom:0;border:3px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--ink)}
.sq .no{position:absolute;top:1px;left:4px;font-size:.58rem;font-weight:700;opacity:.55}
.sq .mini{position:absolute;right:3px;bottom:0;font-size:.8rem}
.sq .tok{font-size:1.9rem;animation:bob 1.6s ease-in-out infinite}
.sq.here .in{outline:4px solid #fff;outline-offset:-2px}
.hud{display:flex;flex-wrap:wrap;justify-content:center;margin:0 0 8px}
.hud .pill{margin:3px}
.ctrl{display:flex;align-items:center;margin-top:12px}
.ctrl>*{margin-right:10px}
.ctrl>*:last-child{margin-right:0}
.dice{min-width:78px;text-align:center;font-size:1.9rem;font-weight:700;border:3px solid var(--line);border-radius:16px;padding:4px 8px;background:#fff}
.status{text-align:center;font-weight:700;min-height:1.5em;margin:8px 0 0}

/* modal */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:rgba(30,20,10,.6);z-index:50;padding:12px}
.modal.on{display:flex}
.mcard{width:100%;max-width:470px;max-height:95vh;overflow:auto;background:var(--card);color:var(--ink);border:4px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 6px 0 var(--line);text-align:center}
.badge{display:inline-block;border:3px solid var(--line);border-radius:999px;padding:2px 14px;font-weight:700;background:var(--gold);margin-bottom:6px}
.bigem{font-size:4.4rem;line-height:1.1}
.bignum{font-size:4rem;font-weight:700;line-height:1.1;font-family:Georgia,serif}
.big{font-size:3.4rem;line-height:1.15}
.opts{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;gap:10px;margin:10px 0}
.opts.sent{grid-template-columns:1fr}
.opt{color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 6px;cursor:pointer;box-shadow:0 4px 0 var(--line);min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;touch-action:manipulation;font-size:1.1rem;font-weight:700;line-height:1.15}
.opt .em{font-size:3rem;line-height:1.1}
.opt .lb{font-size:.9rem}
.opt.pics{min-height:92px}
.opt.yn{min-height:64px;font-size:1.2rem}
.opt:disabled{cursor:default}
.opt.good{background:var(--goodbg);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.bad{background:var(--badbg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.opt.hide{visibility:hidden}
.fb{border-radius:14px;padding:8px 12px;margin:8px 0 10px;font-weight:700}
.fb.good{background:var(--goodbg);border:3px solid var(--good)}
.fb.bad{background:var(--badbg);border:3px solid var(--bad)}
.slots{min-height:60px;border:3px dashed var(--line);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;margin:8px 0}
.pool{display:flex;flex-wrap:wrap;justify-content:center;margin:8px 0 10px}
.tk{font-weight:700;font-size:1.3rem;color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:12px;padding:5px 13px;cursor:pointer;box-shadow:0 3px 0 var(--line);touch-action:manipulation;margin:4px}
.tk.ans{background:var(--gold)}
.cmd{font-size:1.55rem;font-weight:700;margin:6px 0}
.who{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:4px}
.who>*{margin:4px 6px}
.avatar{font-size:2.8rem;line-height:1}
.bubble{background:#fff;border:3px solid var(--line);border-radius:18px;padding:5px 12px;font-weight:700}
.wordtag{display:inline-block;background:#fff;border:3px solid var(--line);border-radius:12px;padding:2px 10px;font-weight:700;margin:4px 0}
.say{margin:2px 0 4px}
.stats{display:flex;flex-wrap:wrap;justify-content:center;margin:8px 0}
.stat{border:3px solid var(--line);border-radius:14px;padding:3px 10px;margin:4px;background:#fff;font-weight:700}
.legend{display:grid;grid-template-columns:1fr;grid-gap:6px;gap:6px;text-align:left;margin:8px 0}
.legend div{display:flex;align-items:center;font-size:.95rem}
.legend span.ic{display:inline-block;min-width:38px;text-align:center;font-size:1.4rem;margin-right:6px}
.pop{position:fixed;pointer-events:none;z-index:60;font-size:1.6rem}
.float{position:fixed;left:50%;top:30%;transform:translate(-50%,0);font-weight:700;font-size:1.5rem;pointer-events:none;z-index:70;text-shadow:0 0 6px #fff,0 0 6px #fff}
.shipsel{display:grid;grid-template-columns:1fr 1fr 1fr;grid-gap:10px;gap:10px;margin-top:10px}
.sh{color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 4px;text-align:center;cursor:pointer;box-shadow:0 4px 0 var(--line);font-size:.85rem;touch-action:manipulation}
.sh .em{font-size:2.4rem;display:block;line-height:1.1}
.sh.on{background:var(--gold)}
.sh.lock{opacity:.5;border-style:dashed;cursor:default;box-shadow:none}
.rank{display:flex;align-items:center;justify-content:space-between;border:3px solid var(--line);border-radius:14px;padding:6px 12px;margin:6px 0;background:#fff;font-weight:700;text-align:left}
.rank.lock{opacity:.5;border-style:dashed}
.stk{color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;box-shadow:0 3px 0 var(--line);touch-action:manipulation;font-size:1rem}
.stk .em{font-size:2.4rem;line-height:1.1}
.stk b{font-size:.85rem;text-align:center}
.stk.lock{opacity:.55;border-style:dashed;box-shadow:none;cursor:default}
.stk.lock .em{filter:grayscale(1)}
@media (max-width:420px){.opt .em{font-size:2.6rem}.bigem{font-size:3.8rem}}
@media (prefers-reduced-motion: reduce){.ship,.sq .tok{animation:none}}

/* teacher editor */
.ed{-webkit-user-select:text;user-select:text}
.ed label{display:block;font-weight:700;margin:12px 0 4px;text-align:left}
.ed input[type=text]{width:100%;font-size:1rem;color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:12px;padding:8px 12px}
.ed textarea{width:100%;font-family:Consolas,Menlo,monospace;font-size:.95rem;line-height:1.45;color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:12px;padding:10px;min-height:300px;resize:vertical}
.ed .chk{display:flex;align-items:center;margin:10px 0;font-weight:600;text-align:left}
.ed .chk input{margin-right:8px;width:20px;height:20px}
.ed .info{background:#fff;border:3px solid var(--line);border-radius:12px;padding:8px 12px;margin:10px 0;text-align:left;font-size:.95rem}
.ed .info .w{color:var(--bad)}
.ed details{margin:10px 0;text-align:left}
.ed summary{cursor:pointer;font-weight:700;padding:6px 0}
.ed pre{background:#fff;border:3px solid var(--line);border-radius:12px;padding:10px;font-size:.9rem;overflow:auto;white-space:pre-wrap;text-align:left;margin:8px 0}
.emo{display:flex;flex-wrap:wrap;max-height:180px;overflow:auto;border:3px solid var(--line);border-radius:12px;padding:6px;background:#fff}
.emo button{font-size:1.5rem;background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:8px}
.msg{font-weight:700;margin:10px 0 0;text-align:left}
.msg.err{color:var(--bad)}
</style>
</head>

<script id="deck-data" type="application/json">{"v": 1, "title": "Treasure Hunt", "source": "# Unit 1 - Quốc gia\n🇺🇸 | America / American\n🇦🇺 | Australia / Australian\n🇬🇧 | Britain / British\n🇻🇳 | Vietnam / Vietnamese\nask | Where are you from? | I'm from {w}.\nask | Where is he from? | He's from {w}.\nask | Where is she from? | She's from {w}.\n\n# Unit 2 - Giờ\n⏰ | o'clock\n🕧 | half past\ntime | What time is it? | It's {t}.\ntime | What time do you get up? | I get up at {t}.\ntime | What time do you go to school? | I go to school at {t}.\ntime | What time do you go to bed? | I go to bed at {t}.\n\n# Unit 3 - Thứ trong tuần\n🌙 | Monday\n🔥 | Tuesday\n🐫 | Wednesday\n⚡ | Thursday\n🎉 | Friday\n⚽ | Saturday\n☀️ | Sunday\nseq | Monday | Tuesday | Wednesday | Thursday | Friday | Saturday | Sunday\nask | What day is it today? | It's {w} today.\n\n# Unit 3 - Việc làm trong tuần\n📚 | study at school | Mondays\n🏠 | stay at home | Sundays\nask | What do you do on {v}? | I {w} on {v}.\n\n# Unit 4 - Tháng\n🎆 | January\n💝 | February\n🌷 | March\n🌧️ | April\n🌺 | May\n🏖️ | June\n🍉 | July\n🌻 | August\n🏫 | September\n🎃 | October\n🍂 | November\n🎄 | December\nseq | January | February | March | April | May | June | July | August | September | October | November | December\nask | When's your birthday? | It's in {w}.\n\n# Unit 5 - Khả năng\n🍳 | cook a meal\n🎨 | draw a picture\n🤸 | jump rope\n🎤 | sing a song\n🛼 | roller skate\n🎹 | play the piano\n🎸 | play the guitar\nask | What can you do? | I can {w}.\nyesno | Can you {w}? | Yes, I can. | No, I can't. | I can\nyesno | Can {he} {w}? | Yes, {he} can. | No, {he} can't. | {name} can\n", "showText": false}</script>
<script id="app-js">
/* =====================================================================
   Treasure Hunt: a pirate board game. Roll the dice, sail, answer questions.
   The words come from words.txt (same format as Word Adventure / Word Rush,
   plus two extra lines: "numbers | 11 | 100" and "age | question | answer").
   ===================================================================== */
function $(id){ return document.getElementById(id); }
var app = $('app');
var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function sample(a,n){ return shuffle(a).slice(0,n); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uniq(a){ var o=[]; a.forEach(function(x){ if(o.indexOf(x)<0) o.push(x); }); return o; }
function art(s){ return /^[aeiou]/i.test(s) ? 'an' : 'a'; }
var canSpeak = ('speechSynthesis' in window) && (typeof SpeechSynthesisUtterance !== 'undefined');
function say(t){
  try{
    if (!canSpeak || (P && P.muted)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.88; window.speechSynthesis.speak(u);
  }catch(e){}
}
var ac = null;
function tone(seq){
  try{
    if (P && P.muted) return;
    var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    ac = ac || new AC();
    var t = ac.currentTime;
    seq.forEach(function(p){
      var o=ac.createOscillator(), g=ac.createGain();
      o.type='triangle'; o.frequency.value=p[0];
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.16,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+p[1]);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+p[1]+.02); t+=p[1];
    });
  }catch(e){}
}
function okS(){ tone([[660,.08],[880,.14]]); }
function badS(){ tone([[300,.14],[230,.2]]); }
function coinS(){ tone([[988,.06],[1319,.12]]); }
function burst(emojis, n){
  if (reduce) return;
  n = n || 16;
  for (var i=0;i<n;i++){
    (function(){
      var s = document.createElement('span');
      s.className='pop'; s.textContent = pick(emojis);
      s.style.left = (30+Math.random()*40)+'vw'; s.style.top = '55vh';
      document.body.appendChild(s);
      var dx = (Math.random()-.5)*320, dy = -(120+Math.random()*260), d = 1000+Math.random()*500;
      void s.offsetWidth;
      s.style.transition = 'transform '+d+'ms ease-out, opacity '+d+'ms ease-out';
      s.style.transform = 'translate('+dx+'px,'+dy+'px) rotate('+(Math.random()*360)+'deg)';
      s.style.opacity = '0';
      setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, d+120);
    })();
  }
}
function floatText(text){
  var s = document.createElement('div');
  s.className = 'float'; s.textContent = vi(text);
  document.body.appendChild(s);
  void s.offsetWidth;
  s.style.transition = 'transform .9s ease-out, opacity .9s ease-out';
  s.style.transform = 'translate(-50%,-60px)'; s.style.opacity = '0';
  setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 1000);
}

/* ---------- numbers ---------- */
var ONES = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
var TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function numWord(n){
  if (n < 20) return ONES[n];
  if (n < 100){ var t = Math.floor(n/10), u = n % 10; return TENS[t] + (u ? '-' + ONES[u] : ''); }
  if (n === 100) return 'one hundred';
  return String(n);
}
function numDistractors(n, lo, hi, count){
  var c = [];
  function add(x){ if (x >= lo && x <= hi && x !== n && c.indexOf(x) < 0) c.push(x); }
  if (n >= 13 && n <= 19) add((n-10)*10);                                  /* 13 / 30 */
  if (n >= 30 && n <= 90 && n % 10 === 0) add(n/10 + 10);                  /* 30 / 13 */
  if (n >= 21 && n <= 99 && n % 11 !== 0 && n % 10 !== 0) add((n%10)*10 + Math.floor(n/10));  /* 37 / 73 */
  add(n+1); add(n-1); add(n+10); add(n-10); add(n+2); add(n-2);
  var near = c.slice(0, 5), out = sample(near, count);
  var guard = 0;
  while (out.length < count && guard++ < 60){
    var r = lo + Math.floor(Math.random() * (hi - lo + 1));
    if (r !== n && out.indexOf(r) < 0) out.push(r);
  }
  return out;
}

/* ---------- the word list ---------- */
function isEmoji(s){ return /[^\x00-\x7F]/.test(s) && !/[A-Za-z0-9]/.test(s); }
var KIDS = [{n:'Mai',e:'👧',g:'she'},{n:'Nam',e:'👦',g:'he'},{n:'Lan',e:'👩',g:'she'},{n:'Tom',e:'🧒',g:'he'}];
function kidTpl(s, k){ return String(s).replace(/\{name\}/g, k.n).replace(/\{He\}/g, k.g==='she' ? 'She' : 'He').replace(/\{he\}/g, k.g); }
function parseDeck(src){
  var d = {groups:[], words:[], warnings:[], nums:null, ages:[]};
  var g = null;
  function warn(n, m){ d.warnings.push('Dòng '+n+': '+m); }
  function mk(name){ return {name:name, words:[], pats:[], nums:null, ages:[], times:[], seqs:[]}; }
  function ensure(){ if(!g){ g = mk('Words'); d.groups.push(g); } return g; }
  String(src||'').split(/\r?\n/).forEach(function(raw, i){
    var ln = raw.trim(), n = i+1;
    if (!ln || ln.indexOf('//') === 0) return;
    if (ln.charAt(0) === '#'){ g = mk(ln.replace(/^#+\s*/,'').trim() || 'Group'); d.groups.push(g); return; }
    var f = ln.split(/[|｜]/).map(function(s){ return s.trim(); });
    var k = f[0].toLowerCase();
    if (k === 'tip') return;
    if (k === 'numbers'){
      var lo = parseInt(f[1], 10), hi = parseInt(f[2], 10);
      if (isNaN(lo)) lo = 11; if (isNaN(hi)) hi = 100;
      lo = Math.max(1, Math.min(lo, 99)); hi = Math.max(lo + 3, Math.min(hi, 100));
      ensure().nums = {min:lo, max:hi}; return;
    }
    if (k === 'age'){
      if (!f[1] || !f[2] || f[2].indexOf('{n}') < 0) return warn(n, 'age cần: câu hỏi | câu trả lời có {n}');
      ensure().ages.push({q:f[1], a:f[2]}); return;
    }
    if (k === 'time'){
      if (!f[1] || !f[2] || f[2].indexOf('{t}') < 0) return warn(n, 'time cần: câu hỏi | câu trả lời có {t}');
      ensure().times.push({q:f[1], a:f[2]}); return;
    }
    if (k === 'seq'){
      var it = f.slice(1).filter(Boolean);
      if (it.length < 4) return warn(n, 'seq cần ít nhất 4 mục');
      ensure().seqs.push(it); return;
    }
    if (k === 'ask' || k === 'do' || k === 'yesno'){
      if (k === 'ask'){
        if (!f[1] || !f[2]) return warn(n, 'ask cần 2 phần: câu hỏi | câu trả lời');
        if (!/\{(w|W|pl|v)\}/.test(f[2])) return warn(n, 'câu trả lời của ask cần có {w} hoặc {pl}');
        ensure().pats.push({kind:'ask', q:f[1], a:f[2]});
      } else if (k === 'do'){
        if (!f[1] || !/\{(w|W|pl|v)\}/.test(f[1])) return warn(n, 'do cần có {w} hoặc {v} trong câu');
        ensure().pats.push({kind:'do', q:f[1]});
      } else {
        if (!f[1]) return warn(n, 'yesno cần câu hỏi');
        ensure().pats.push({kind:'yesno', q:f[1], yes:f[2]||"Yes, I do.", no:f[3]||"No, I don't.", bub:f[4]||'I like'});
      }
      return;
    }
    var e, w;
    if (f.length >= 2 && f[0] && f[1]){
      if (isEmoji(f[0])){ e=f[0]; w=f[1]; }
      else if (isEmoji(f[1])){ e=f[1]; w=f[0]; }
      else { e='❓'; w=f[0]; warn(n, 'thiếu emoji cho "'+w+'"'); }
    } else if (f.length === 1 && f[0]){
      if (isEmoji(f[0])) return warn(n, 'có emoji nhưng thiếu từ');
      e='❓'; w=f[0]; warn(n, 'thiếu emoji cho "'+w+'"');
    } else return warn(n, 'không hiểu dòng này');
    var parts = w.split('/'), sg = parts[0].trim(), pl = (parts[1]||'').trim();
    if (!sg) return warn(n, 'từ bị trống');
    var extra = f.length >= 3 ? f[2] : '';
    var nopat = (extra === '-');
    var gg = ensure();
    var word = {key:(sg+(pl?'/'+pl:'')).toLowerCase(), w:(pl ? sg+' / '+pl : sg), e:e, sg:sg, pl:pl, v:(nopat ? '' : extra), nopat:nopat,
                say:(pl ? sg+'. '+pl+'.' : sg), spell:sg, pats:gg.pats, group:gg};
    gg.words.push(word); d.words.push(word);
  });
  d.groups = d.groups.filter(function(x){ return x.words.length || x.nums || x.ages.length || x.times.length || x.seqs.length; });
  d.groups.forEach(function(x){ if (x.nums && !d.nums) d.nums = x.nums; d.ages = d.ages.concat(x.ages); });
  var seen = {};
  d.words.forEach(function(w){ if (seen[w.key]) d.warnings.push('Từ bị trùng: "'+w.sg+'"'); seen[w.key] = 1; });
  return d;
}
function tpl(s, w, artOverride){
  return s.replace(/\{W\}/g, w.sg.charAt(0).toUpperCase() + w.sg.slice(1)).replace(/\{w\}/g, w.sg).replace(/\{pl\}/g, w.pl)
          .replace(/\{a\}/g, artOverride || art(w.sg)).replace(/\{v\}/g, w.v || '');
}
function patValid(p, w){
  if (w.nopat) return false;
  var s = p.q + ' ' + (p.a || '');
  if (/\{v\}/.test(s) && !w.v) return false;
  if (/\{pl\}/.test(s) && !w.pl) return false;
  return true;
}
function patsFor(kind, w){ return w.pats.filter(function(p){ return p.kind===kind && patValid(p, w); }); }

function useDeck(deck){ DECK = deck; D = parseDeck(deck.source); }
function applyWordsTxt(text){
  var title = DECK.title, showText = DECK.showText, lines = [];
  String(text || '').split(/\r?\n/).forEach(function(ln){
    var m = ln.trim().match(/^@(\w+)\s*(.*)$/);
    if (m){
      var k = m[1].toLowerCase(), v = m[2].trim();
      if (k === 'title' && v) title = v;
      else if (k === 'showtext') showText = /^(on|yes|1|true)$/i.test(v);
    } else lines.push(ln);
  });
  var src = lines.join('\n'), d = parseDeck(src);
  if (d.words.length < 2 && !d.nums) return false;
  useDeck({v:1, title:title, source:src, showText:showText});
  return true;
}

  for (var i=0;i<Qc.pool.length;i++){ if (Qc.pool[i].id === id){ k = i; break; } }
  if (k < 0) return;
  Qc.ans.push(Qc.pool.splice(k, 1)[0]);
  if (!Qc.pool.length){
    var joined = Qc.ans.map(function(x){ return x.t; }).join(Qc.q.words ? ' ' : '');
    settle(joined === Qc.q.answer.split(/\s+/).join(Qc.q.words ? ' ' : ''));
    return;
  }
  tone([[520,.04]]); renderQuestion(false);
}
function spellBack(i){
  if (!Qc || Qc.done) return;
  Qc.pool.push(Qc.ans.splice(i, 1)[0]); renderQuestion(false);
}
function settle(ok){
  var q = Qc.q;
  Qc.done = true; Qc.ok = ok;
  if (ok) okS(); else badS();
  if (q.subject){ var k = q.subject.key; P.mastery[k] = ok ? Math.min(5, (P.mastery[k]||0)+1) : Math.max(0, (P.mastery[k]||0)-1); }
  if (q.num){
    if (!P.nhard) P.nhard = [];
    var i = P.nhard.indexOf(q.num);
    if (!ok && i < 0){ P.nhard.push(q.num); if (P.nhard.length > 12) P.nhard.shift(); }
    if (ok && i >= 0) P.nhard.splice(i, 1);
  }
  if (G){ G.answered++; if (ok){ G.correct++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak); } else G.streak = 0; }
  saveP();
  if (ok){ var sp = q.speakAnswer || (q.subject ? q.subject.say : null); if (sp) say(sp); burst(['⭐'], 5); }
  renderQuestion(false);
  drawHud();
}

}

/* ---------- the board ---------- */
function genSquares(len){
  var sq = [], i;
  for (i=0;i<len;i++) sq.push('q');
  sq[0] = 'start'; sq[len-1] = 'end';
  var pirates = 0, maxP = len >= 36 ? 2 : 1;
  i = 3;
  while (i <= len - 4){
    var bag = ['coin','coin','chest','parrot','lucky'];
    if (i >= 6) bag.push('storm','shark');
    if (i >= 8 && i <= len - 6) bag.push('whirl');
    if (i >= Math.round(len * 0.35) && pirates < maxP) bag.push('pirate','pirate');
    var t = pick(bag); if (t === 'pirate') pirates++;
    sq[i] = t;
    i += 2 + Math.floor(Math.random() * 3);
  }
  if (!pirates){ var pi = Math.round(len * 0.6); if (sq[pi] === 'q') sq[pi] = 'pirate'; }
  return sq;
}
function startVoyage(){
  closeModal();
  var len = P.len; if (len !== 20 && len !== 28 && len !== 36) len = 28; P.len = len;
  G = {len:len, sq:genSquares(len), pos:0, gold:0, gems:0, hints:1, streak:0, bestStreak:0, answered:0, correct:0, turns:0, busy:false, over:false, dice:'🎲', force:null};

}

function drawBoardOld(){

  var cols = 5, rows = Math.ceil(G.len / cols), html = '';
  for (var dr = 0; dr < rows; dr++){

      var n = r * cols + (r % 2 === 0 ? dc : cols - 1 - dc);
      if (n >= G.len){ html += '<div></div>'; continue; }
      var t = SQT[G.sq[n]], here = (n === G.pos);
      html += '<div class="sq'+(here ? ' here' : '')+'"><div class="in" style="background:'+t.bg+'"><span class="no">'+(n===0 ? '' : n)+'</span>'+

function ringPos(i,n){
  var s = n - 1;
  if (i <= s) return {r:n, c:n-i, side:'b'};
  if (i <= 2*s) return {r:n-(i-s), c:1, side:'l'};
  if (i <= 3*s) return {r:1, c:1+(i-2*s), side:'t'};
  return {r:1+(i-3*s), c:n, side:'r'};
}
function drawBoard(){
  var b = $('board'); if (!b || !G) return;

  for (var i = 0; i < G.len; i++){
    var p = ringPos(i, n), t = SQT[G.sq[i]], here = (i === G.pos), corner = (i % s === 0);
    var band = (G.sq[i] === 'q' && !corner) ? '<i class="band '+p.side+'" style="background:'+cols[Math.floor(i/3)%8]+'"></i>' : '';
    html += '<div class="sq'+(here ? ' here' : '')+(corner ? ' corner' : '')+'" style="grid-row:'+p.r+';grid-column:'+p.c+'"><div class="in" style="background:'+t.bg+'">'+band+

function roll(){
  if (!G || G.busy || G.over) return;
  G.busy = true; drawCtrl();
  var n = 0;
  var iv = setInterval(function(){
    G.dice = 1 + Math.floor(Math.random()*6); var d = $('dice'); if (d) d.textContent = G.dice; tone([[500,.03]]);
    if (++n >= 8){
      clearInterval(iv);
      var v = (G.force && G.force.length) ? G.force.shift() : 1 + Math.floor(Math.random()*6);
      G.dice = v; var d2 = $('dice'); if (d2) d2.textContent = v;

      setStatus('You rolled '+v+'!');
      setTimeout(function(){ moveBy(v); }, 450);

}
function moveBy(v){
  var target = Math.min(G.len - 1, G.pos + v);
  (function step(){
    if (!G) return;
    if (G.pos < target){ G.pos++; tone([[420+G.pos*8,.05]]); drawBoard(); drawHud(); setTimeout(step, 230); }
    else land();
  })();
}
function moveBack(k, cb){
  var target = Math.max(0, G.pos - k);
  (function step(){
    if (!G) return;
    if (G.pos > target){ G.pos--; tone([[360,.05]]); drawBoard(); drawHud(); setTimeout(step, 230); }
    else if (cb) cb();
  })();
}
function endTurn(){
  if (!G || G.over) return;
  G.busy = false; drawBoard(); drawHud(); drawCtrl();
  setStatus('Roll the dice!');
}
function reward(){ return 10 + 2 * Math.min(G.streak, 5); }
function addGold(n){ G.gold = Math.max(0, G.gold + n); drawHud(); }

function land(){
  var t = G.sq[G.pos];
  drawBoard(); drawHud();
  if (t === 'end') return finalTest();
  if (t === 'q'){
    var r = reward();
    setStatus('A question!');
    askQuestion({label:'Answer to win gold!', okMsg:'Great! +'+r+' 💰', badMsg:'Not quite!'}, function(ok){
      if (ok){ addGold(r); coinS(); floatText('+'+r+' 💰'); }
      endTurn();
    });
    return;
  }
  if (t === 'coin'){
    evt('💰', 'Gold coins!', 'You found a pile of gold. +8 💰', 'Yo ho ho!', function(){ addGold(8); coinS(); burst(['💰','✨'], 10); endTurn(); });
    return;
  }
  if (t === 'parrot'){
    evt('🦜', 'Your parrot is here!', 'Squawk! Hint +1. Use it on a hard question to remove two wrong answers.', 'Thanks!', function(){ G.hints++; drawHud(); endTurn(); });
    return;
  }
  if (t === 'lucky'){
    evt('🍀', 'Lucky clover!', 'Roll the dice again!', 'Roll!', function(){ G.busy = false; drawCtrl(); setStatus('Roll again!'); setTimeout(roll, 150); });
    return;
  }

    var r2 = Math.random();

    else if (r2 < .7)  evt('🎁', 'Treasure chest!', 'A sparkling gem! +1 💎', 'Wow!', function(){ G.gems++; drawHud(); coinS(); burst(['💎','✨'], 12); endTurn(); });
    else if (r2 < .9)  evt('🎁', 'Treasure chest!', 'Two parrot hints! +2 🦜', 'Thanks!', function(){ G.hints += 2; drawHud(); endTurn(); });
    else               evt('🎁', 'Treasure chest!', 'A magic wind! Move forward 2 squares.', 'Sail!', function(){ moveBy2(2); });
    return;
  }
  if (t === 'whirl'){
    evt('🌀', 'Whirlpool!', 'Hold on! The water spins your ship...', 'Spin!', function(){
      var lo = Math.max(1, G.pos - 3), hi = Math.min(G.len - 2, G.pos + 5), np = lo + Math.floor(Math.random() * (hi - lo + 1));
      G.pos = np; tone([[300,.1],[500,.1],[700,.1]]); drawBoard(); drawHud();
      setStatus('The whirlpool took you to square '+np+'!');

    });

  if (t === 'storm'){
    evt('⛈️', 'Storm!', 'Answer a question to calm the sea. If not, you sail back 3 squares!', 'I can do it!', function(){
      askQuestion({label:'⛈️ Calm the storm!', okMsg:'The sea is calm! +5 💰', badMsg:'The storm pushes you back!'}, function(ok){

      askQuestion({label:'🦈 Scare the shark!', okMsg:'The shark swims away! +15 💰', badMsg:'Chomp! -8 💰'}, function(ok){

      });

  }
  if (t === 'pirate'){
    evt('🏴‍☠️', 'Pirate battle!', 'Answer 3 questions. Win 2 and you beat the pirates!', 'Fight!', function(){ battle(3, 2, 0, 0); });
    return;
  }

}
function moveBy2(k){

        '<button class="btn" onclick="useExample()">Dùng mẫu</button></div>'+
      '<p class="msg" id="ed-msg"></p>'+
      '<div class="foot"><button class="link" onclick="confirmReset()">Xóa tiến độ chơi trên thiết bị này</button></div>'+
    '</div>');
  $('ed-emo').innerHTML = EMOJI.map(function(e){ return '<button type="button" data-e="'+e+'" onclick="insEmoji(this.getAttribute(\'data-e\'))">'+e+'</button>'; }).join('');
  edInfo();
}
function curDeck(){ return {v:1, title:($('ed-title').value.trim() || 'Treasure Hunt'), source:$('ed-src').value, showText:$('ed-show').checked}; }
function edInfo(){
  var d = parseDeck($('ed-src').value);
  var html = '<b>'+d.words.length+' từ</b> · '+d.groups.length+' nhóm'+(d.nums ? ' · có phần số ('+d.nums.min+' đến '+d.nums.max+')' : '')+(d.ages.length ? ' · có câu hỏi tuổi' : '');
  if (d.words.length < 2) html += '<br><span class="w">Cần ít nhất 2 từ để chơi.</span>';
  else if (d.words.length < 4) html += '<br><span class="w">Nên có từ 4 từ trở lên để câu hỏi có đủ lựa chọn.</span>';
  d.warnings.slice(0,6).forEach(function(w){ html += '<br><span class="w">⚠️ '+esc(w)+'</span>'; });
  if (d.warnings.length > 6) html += '<br><span class="w">... và '+(d.warnings.length-6)+' cảnh báo khác</span>';
  $('ed-info').innerHTML = html;
}
function insEmoji(e){
  var ta = $('ed-src'); ta.focus();
  var s = ta.selectionStart, t = ta.selectionEnd;
  if (typeof s !== 'number'){ ta.value += e; }
  else { ta.value = ta.value.slice(0,s) + e + ta.value.slice(t); ta.selectionStart = ta.selectionEnd = s + e.length; }
  edInfo();
}
function msg(t, err){ var m=$('ed-msg'); if(m){ m.textContent=t; m.className='msg'+(err?' err':''); } }
function useExample(){ $('ed-src').value = EXAMPLE; edInfo(); msg('Đã điền danh sách mẫu. Bạn có thể sửa rồi sao chép.'); }
function testDeck(){
  var deck = curDeck();
  if (parseDeck(deck.source).words.length < 2){ msg('Cần ít nhất 2 từ để chơi thử.', true); return; }
  useDeck(deck); home();
}
function buildWordsTxt(){
  var d = curDeck();
  return '@title '+d.title+'\n@showtext '+(d.showText ? 'on' : 'off')+'\n\n'+d.source.replace(/\s+$/,'')+'\n';
}
function copyList(){
  var text = buildWordsTxt();
  var tmp = document.createElement('textarea');
  tmp.value = text; tmp.style.position = 'fixed'; tmp.style.top = '0'; tmp.style.opacity = '0';
  document.body.appendChild(tmp); tmp.focus(); tmp.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(tmp);
  if (ok){ msg('Đã sao chép! Giờ dán vào file words.txt trên GitHub rồi bấm Commit.'); }
  else {
    openModal('<h2>Sao chép thủ công</h2><p class="hint">Chọn hết nội dung dưới đây, sao chép rồi dán vào words.txt.</p>'+
      '<textarea id="manual-copy" readonly style="width:100%;min-height:220px;font-family:Consolas,Menlo,monospace;font-size:.9rem;border:3px solid var(--line);border-radius:12px;padding:8px;background:#fff;color:var(--ink)"></textarea>'+
      '<button class="btn gold big" style="margin-top:10px" onclick="closeModal()">Xong</button>');
    var mc = $('manual-copy'); mc.value = text; mc.focus(); mc.select();
  }
}
function confirmReset(){
  openModal('<h2>Xóa tiến độ?</h2><p class="hint">Vàng, tàu, cấp bậc và các sao từ vựng trên thiết bị này sẽ bị xóa.</p>'+
    '<div class="row"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn gold" onclick="doReset()">Xóa</button></div>');
}
function doReset(){ P = freshP(); saveP(); closeModal(); home(); }

function boot(){
  if (location.hash === '#teacher') isTeacher = true;
  if (window.fetch){
    app.innerHTML = '<div class="panel center"><div class="ship">⛵</div><p class="hint">Đang tải...</p></div>';
    var done = false;
    var fin = function(){ if (done) return; done = true; home(); };
    setTimeout(fin, 2000);
    try{
      fetch('words.txt?v=' + Date.now(), {cache:'no-store'}).then(function(r){
        if (!r.ok) throw new Error('no words.txt');
        return r.text();
      }).then(function(t){ if (!done) applyWordsTxt(t); fin(); }).catch(fin);
    }catch(e){ fin(); }
  } else home();
}
boot();
</script>
</body>
</html>
